[project]
name = "unoq-nmea2000"
version = "0.1.0"
description = "Passive, receive-only NMEA 2000 diagnostic and discovery platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "hypothesis>=6.112,<7.0",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "property: Hypothesis-backed correctness property test",
    "integration: full mock-to-domain pipeline / cross-transport integration test",
]

[tool.coverage.run]
source = ["protocol", "service", "ble", "web", "simulator"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["protocol*", "service*", "ble*", "web*", "simulator*"]
