# Keep the journal on disk and flush it often, so a dirty power-off loses seconds, not minutes.
# Default SyncIntervalSec is 5 minutes. On 2026-10-09 the boat boot's journal ended about 4 minutes
# in, and everything after was lost. Install: /etc/systemd/journald.conf.d/unoq.conf
# (scripts/install_blackbox.sh does this and restarts systemd-journald).
[Journal]
Storage=persistent
SyncIntervalSec=10s
